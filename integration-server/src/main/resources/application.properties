spring.application.name=safehome-integration-server
server.address=${INTEGRATION_BIND_ADDRESS:127.0.0.1}
server.port=${INTEGRATION_PORT:8090}
spring.ai.mcp.server.name=safehome-building-tools
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
safehome.integration.token=${SAFEHOME_INTEGRATION_TOKEN:}
safehome.building.service-key=${BUILDING_HUB_SERVICE_KEY:}
# Use the decoded data.go.kr service key. No key-bearing URI may be logged.
logging.level.org.springframework.web.client=OFF
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
spring.config.import=optional:file:${SAFEHOME_CONFIG_FILE:./config/safehome-local.yml}
safehome.building.call-history-directory=${SAFEHOME_INTEGRATION_CALL_HISTORY_DIR:D:/safehome-data/integration/call-history}
