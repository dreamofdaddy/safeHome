spring:
  application:
    name: safehome-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/safehome
    username: safehome
    password: ${POSTGRES_PASSWORD:safehome_local}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info
