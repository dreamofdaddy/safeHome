services:

  postgres:
    image: postgres:17
    container_name: safehome-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: safehome
      POSTGRES_USER: safehome
      POSTGRES_PASSWORD: safehome_local

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safehome -d safehome"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: safehome-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
